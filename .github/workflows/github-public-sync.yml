name: Sync public GitHub activity (inventario Yggdra)

# Solo repos públicos listados en data/projects.json (+ yggdra-web).
# Repos privados del ecosistema no se consultan.

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-public-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch public metadata for inventory repos only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_github_public.py

      - name: Privacy gate
        run: python3 scripts/check_privacy.py

      - name: Commit updated public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github.public.json
          if git diff --staged --quiet; then
            echo "Sin cambios en github.public.json"
            exit 0
          fi
          git commit -m "data: sync actividad pública del inventario Yggdra"
          git push
